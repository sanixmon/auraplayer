name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build FFmpeg (LGPL), Unit Test, Lint, Signed APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync bundled Changelog asset
        run: |
          chmod +x scripts/changelog-wrapper.sh
          ./scripts/changelog-wrapper.sh --sync-assets

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Restore cached LGPL Media3 FFmpeg AAR
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: app/libs/lib-decoder-ffmpeg-release.aar
          key: media3-1.5.1-ffmpeg-6.0-lgpl-v2

      - name: Build LGPL Media3 FFmpeg AAR (on cache miss)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm
          SDKMANAGER=$(command -v sdkmanager || ls "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          set +o pipefail
          yes | "${SDKMANAGER}" "ndk;25.1.8937393" "cmake;3.22.1" >/dev/null
          set -o pipefail

          WORK_DIR="${RUNNER_TEMP}/media3-ffmpeg"
          rm -rf "${WORK_DIR}"
          git clone --depth 1 --branch 1.5.1 https://github.com/androidx/media.git "${WORK_DIR}/media"

          FFMPEG_MODULE_PATH="${WORK_DIR}/media/libraries/decoder_ffmpeg/src/main"
          NDK_PATH="${ANDROID_HOME}/ndk/25.1.8937393"
          HOST_PLATFORM="linux-x86_64"
          ANDROID_API=21
          ENABLED_DECODERS=(mp3 aac ac3 eac3 dca alac flac vorbis opus wmav1 wmav2 wmapro ape mpc7 mpc8 tta wavpack mlp truehd pcm_s16le pcm_s24le pcm_s32le pcm_f32le)

          git clone --depth 1 --branch release/6.0 https://github.com/FFmpeg/FFmpeg.git "${FFMPEG_MODULE_PATH}/jni/ffmpeg"
          cd "${FFMPEG_MODULE_PATH}/jni"
          ./build_ffmpeg.sh "${FFMPEG_MODULE_PATH}" "${NDK_PATH}" "${HOST_PLATFORM}" "${ANDROID_API}" "${ENABLED_DECODERS[@]}"

          cd "${WORK_DIR}/media"
          ./gradlew :lib-decoder-ffmpeg:assembleRelease --no-daemon

          mkdir -p "${GITHUB_WORKSPACE}/app/libs"
          AAR_PATH=$(find "${WORK_DIR}/media/libraries/decoder_ffmpeg" -name "*release.aar" | head -n 1)
          if [ -z "${AAR_PATH}" ]; then
            echo "Failed to locate compiled lib-decoder-ffmpeg-release.aar"
            exit 1
          fi
          cp "${AAR_PATH}" "${GITHUB_WORKSPACE}/app/libs/lib-decoder-ffmpeg-release.aar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Release Signing Keystore (when configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
          echo "RELEASE_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: gradle lintDebug --stacktrace

      - name: Build Signed arm64-v8a Release APK
        run: gradle assembleRelease --stacktrace

      - name: Package Release APK, Checksum & Wrapped Changelog
        id: package-release
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -E 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          RAW_APK=$(find app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)
          if [ -z "${RAW_APK}" ]; then
            echo "No arm64-v8a release APK found"
            exit 1
          fi
          mkdir -p release-out
          APK_NAME="aura-player-v${VERSION_NAME}-arm64-v8a.apk"
          cp "${RAW_APK}" "release-out/${APK_NAME}"
          (cd release-out && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
          ./scripts/changelog-wrapper.sh \
            --version "${VERSION_NAME}" \
            --apk "release-out/${APK_NAME}" \
            --out "release-out/RELEASE_NOTES.md"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=release-out/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_path=release-out/${APK_NAME}.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.package-release.outputs.tag_name }}"
          VERSION="${{ steps.package-release.outputs.version_name }}"
          APK_PATH="${{ steps.package-release.outputs.apk_path }}"
          SHA_PATH="${{ steps.package-release.outputs.sha_path }}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "Aura Player v${VERSION}" \
              --notes-file "release-out/RELEASE_NOTES.md" \
              --latest
            gh release upload "${TAG}" "${APK_PATH}" "${SHA_PATH}" --clobber
          else
            gh release create "${TAG}" \
              "${APK_PATH}" \
              "${SHA_PATH}" \
              --target "${GITHUB_SHA}" \
              --title "Aura Player v${VERSION}" \
              --notes-file "release-out/RELEASE_NOTES.md" \
              --latest
          fi

      - name: Upload arm64-v8a Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-player-arm64-v8a-release-apk
          path: |
            release-out/*.apk
            release-out/*.sha256
            app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: warn

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
